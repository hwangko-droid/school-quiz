    explain: "방관을 선택하는 것은 암묵적으로 가해를 허용하는 것입니다. 직접 개입이 위험하다면 즉시 117이나 교사에게 알리는 것이 가장 효과적입니다."

const LETTERS = ['①','②','③','④'];
const MEDALS  = ['🥇','🥈','🥉','4위','5위'];

let current = 0, score = 0, answered = false, submitted = false;
const sbReady = SUPABASE_URL && !SUPABASE_URL.includes('YOUR_SUPABASE_URL');

/* ──────────────────────────────────────────
   Supabase REST helpers
────────────────────────────────────────── */
const sbHeaders = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json'
};

async function sbGet() {
  try {
    const r = await fetch(
      SUPABASE_URL + '/rest/v1/leaderboard?select=name,student_id,score,created_at&order=score.desc,created_at.asc&limit=20',
      { headers: sbHeaders }
    );
    if (!r.ok) return [];
    return await r.json();
  } catch { return []; }
}

async function sbPush(entry) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/leaderboard', {
    method: 'POST',
    headers: { ...sbHeaders, 'Prefer': 'return=representation' },
    body: JSON.stringify(entry)
  });
  if (!r.ok) {
    const err = await r.text();
    throw new Error(err);
  }
}

function subscribeLeaderboard() {
  if (!sbReady) return;
  pollLb();
}

async function pollLb() {
  const entries = await sbGet();
  renderLb(entries);
  document.getElementById('lbLive').classList.remove('hidden');
  setTimeout(pollLb, 5000);
}

/* ──────────────────────────────────────────
   Leaderboard render
────────────────────────────────────────── */
function renderLb(entries) {
  entries.sort((a, b) => (b.score - a.score) || (a.time - b.time));
  const top5 = entries.slice(0, 5);
  const el = document.getElementById('lbList');
  if (!top5.length) {
    el.innerHTML = '<div class="lb-empty">아직 등록된 점수가 없습니다.<br>첫 번째 주인공이 되어보세요!</div>';
    return;
  }
  el.innerHTML = '';
  top5.forEach((e, i) => {
    const row = document.createElement('div');
    row.className = 'lb-row r' + (i + 1);
    row.innerHTML = `
      <span class="lb-rank">${MEDALS[i]}</span>
      <div class="lb-info">
        <div class="lb-name">${esc(e.name)}</div>
        <div class="lb-id">학번 ${esc(e.student_id)}</div>
      </div>
      <span class="lb-score">${e.score}점</span>`;
    el.appendChild(row);
  });
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ──────────────────────────────────────────
   Quiz logic
────────────────────────────────────────── */
function renderQuestion() {
  answered = false;
  const q = QUESTIONS[current];
  document.getElementById('progressFill').style.width = (current / 10 * 100) + '%';
  document.getElementById('progressNum').textContent  = current + ' / 10';
  document.getElementById('questionNum').textContent  = `문제 ${current + 1}`;
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('explanation').classList.add('hidden');
  document.getElementById('nextBtn').classList.add('hidden');

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${LETTERS[i]}</span><span>${esc(opt)}</span>`;
    btn.addEventListener('click', () => pick(i));
    container.appendChild(btn);
  });
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = QUESTIONS[current];
  const ok = idx === q.answer;
  if (ok) score++;

  document.querySelectorAll('.option-btn').forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.classList.add('correct');
    else if (i === idx)  btn.classList.add('wrong');
    else                 btn.classList.add('dimmed');
  });

  const exp = document.getElementById('explanation');
  exp.textContent = (ok ? '✓ 정답입니다! ' : '✗ 오답입니다. ') + q.explain;
  exp.classList.remove('hidden');

  const nb = document.getElementById('nextBtn');
  nb.textContent = current < 9 ? '다음 문제 →' : '결과 보기 →';
  nb.classList.remove('hidden');
}

document.getElementById('nextBtn').addEventListener('click', () => {
  current++;
  current < 10 ? renderQuestion() : showResult();
});

/* ──────────────────────────────────────────
   Result
────────────────────────────────────────── */
function showResult() {
  document.getElementById('quizCard').classList.add('hidden');
  document.getElementById('resultCard').classList.remove('hidden');
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressNum').textContent  = '10 / 10';

  // Score ring
  const circ = 2 * Math.PI * 37;
  const ring = document.getElementById('ringFill');
  ring.setAttribute('stroke-dasharray', circ);
  ring.setAttribute('stroke-dashoffset', circ);
  document.getElementById('scoreNum').textContent = score;
  setTimeout(() => ring.setAttribute('stroke-dashoffset', circ * (1 - score / 10)), 80);

  // Message
  const t = score === 10 ? '완벽해요! 🏆'
    : score >= 8 ? '잘했어요! 👍'
    : score >= 6 ? '보통이에요 📚' : '더 공부해봐요 💪';
  const s = `${score}점 / 10점 — 학번과 이름을 입력하고 순위에 도전해 보세요!`;
  document.getElementById('resultTitle').textContent = t;
  document.getElementById('resultSub').textContent   = s;

  // Supabase 없을 때 안내
  if (!sbReady) {
    document.getElementById('setupBanner').classList.remove('hidden');
    showMsg('Supabase URL이 설정되지 않아 순위 기능을 사용할 수 없습니다.', 'info');
    document.getElementById('submitBtn').disabled = true;
    document.getElementById('lbList').innerHTML =
      '<div class="lb-empty">Supabase 설정 후 이용 가능합니다.</div>';
    return;
  }

  // Subscribe to leaderboard
  subscribeLeaderboard();

  // Submit
  document.getElementById('submitBtn').addEventListener('click', async () => {
    if (submitted) return;
    const sid  = document.getElementById('iSid').value.trim();
    const name = document.getElementById('iName').value.trim();
    if (!sid || !name) { showMsg('학번과 이름을 모두 입력해주세요.', 'error'); return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = '등록 중…';

    try {
      await sbPush({ score, name, student_id: sid });
      submitted = true;
      document.getElementById('submitForm').classList.add('hidden');
      showMsg(`✓ ${name} 학생의 ${score}점이 등록되었습니다! 아래 순위를 확인하세요.`, 'success');
    } catch {
      btn.disabled = false; btn.textContent = '점수 등록하기';
      showMsg('등록 중 오류가 발생했습니다. 다시 시도해 주세요.', 'error');
    }
  });
}

function showMsg(text, type) {
  const el = document.getElementById('submitMsg');
  el.textContent = text;
  el.className = 'msg ' + type;
  el.classList.remove('hidden');
}

document.getElementById('restartBtn').addEventListener('click', () => {
  current = 0; score = 0; submitted = false;
  if (lbStream) { lbStream.close(); lbStream = null; }
  document.getElementById('resultCard').classList.add('hidden');
  document.getElementById('quizCard').classList.remove('hidden');
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressNum').textContent  = '0 / 10';
  document.getElementById('submitForm').classList.remove('hidden');
  document.getElementById('submitMsg').classList.add('hidden');
  document.getElementById('iSid').value = '';
  document.getElementById('iName').value = '';
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('submitBtn').textContent = '점수 등록하기';
  document.getElementById('lbLive').classList.add('hidden');
  document.getElementById('lbList').innerHTML = '<div class="lb-empty">아직 등록된 점수가 없습니다.</div>';
  renderQuestion();
});

// Init
renderQuestion();
</script>
